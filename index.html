<body>
    <section class="principal">
        <div class="topo">
            <div class="lateral-esquerda">
                <h3 class="button" id="abrir-notas">notas</h3>
                <div id="nota-selector">
                    <div>
                        <div id="notas-grid">
                            <!-- Aqui serão inseridos os checkboxes -->
                        </div>
                        <button id="salvar_padrao">Salvar</button>
                        <button id="limpar-notas">Limpar</button>
                    </div>
                </div>
            </div>
            <div class="lateral-direita">
                <h3 class="button" id="abrir-sequencias">sequencias</h3>
                <div id="sequencias-salvas">
                </div>
            </div>
        </div>
        <div class="controladores">
            <input type="number" id="tempo" placeholder="Tempo (em segundos)" min="1" value="60">
            <div class='controles'>
                <button id="playBtn">Play</button>
                <button id="stopBtn">Stop</button>
            </div>
        </div>
        
        <noscript>
            <div style="padding: 1rem; background-color: #f8f8f8; color: #333; font-size: 14px; line-height: 1.5;">
              <p><strong>Scale Pro</strong> é uma ferramenta online para praticar escalas musicais com som. Você pode selecionar notas e treinar escalas maiores, menores, cromáticas e modos gregos. Ideal para iniciantes e músicos experientes que tocam <strong>violão</strong>, <strong>teclado</strong>, <strong>guitarra</strong> e outros instrumentos.</p>
              <p>Este site utiliza JavaScript para funcionar corretamente. Ative o JavaScript no seu navegador para usar todos os recursos.</p>
            </div>
          </noscript>
          
    </section>
