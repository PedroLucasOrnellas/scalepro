<html lang="pt-br">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Afine seu violão ou guitarra com precisão usando nosso afinador online gratuito. Basta permitir o microfone e comece a tocar. Simples, rápido e eficaz!">
  <title>Afinador de Violão e Guitarra | Scale PRO</title>
  <style>
    .modalAviso {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7); /* fundo escurecido */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1e1e1e; /* fundo do modal escuro */
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      max-width: 400px;
      width: 90%;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      color: #f0f0f0;
      margin: 0 10px;
    }

    .modal-content h2 {
      margin-top: 0;
      color: #ff5252; /* vermelho claro de alerta */
      font-size: 1.8rem;
    }

    .modal-content p {
      font-size: 1rem;
      line-height: 24px;
      color: #cccccc;
      margin: 1.5rem 0;
    }

    #closeModal {
      padding: 0.5rem 1.2rem;
      background-color: #1f6feb; /* azul vibrante */
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #closeModal:hover {
      background-color: #265dbe;
    }


    body {
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #ffffff;
        text-align: center;
        padding: 2rem;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 2rem;
      color: #ffffff;
      font-size: 2.5rem;
      transition: opacity 0.5s;
    }
    #note {
      font-size: 3rem;
      margin: 1rem 0;
      transition: transform 0.3s;
    }
    #freq {
      font-size: 1.2rem;
      color: #8b949e;
    }
    #needle {
      width: 200px;
      height: 100px;
      margin: 2rem auto;
      background-color: #161b22;
      border-radius: 8px;
      transition: transform 0.3s ease-in-out;
    }
    .status {
      font-size: 1.3rem;
      margin-top: 1rem;
    }
    .controls {
      margin: 1rem 0 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }
    button {
      background-color: #1f6feb;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }
    button:hover {
      background-color: #388bfd;
      transform: scale(1.1);
    }
    button:active {
      transform: scale(0.9);
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      h1 {
        font-size: 2rem;
      }
      #note {
        font-size: 2.5rem;
      }
      #freq {
        font-size: 1rem;
      }
      .controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <menu-circular></menu-circular>
  <section class="container">
      <h1>Afinador de Violão e Guitarra</h1>
      <div class="controls">
        <button id="startButton">Iniciar Afinador</button>
        <button id="stopButton">Parar Afinador</button>
      </div>
      <div id="note">---</div>
      <div id="freq">---</div>
      <canvas id="needle"></canvas>
      <div id="status" class="status">Aguardando início...</div>
  </section>

  <section id="modalAviso" class="modalAviso">
    <div class="modal-content">
      <h2>Aviso importante</h2>
      <p>Para usar o afinador, é necessário permitir o acesso ao microfone pelo navegador, <b>para ser possível ouvir seu instrumento</b>.</p>
      <button id="closeModal">Fechar</button>
    </div>
  </section>

  <script src="../scripts/menu.js"></script>
  <script src="../scripts/afinador.js"></script>

</body>
</html>
